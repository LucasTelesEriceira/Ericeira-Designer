<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
    <link rel="manifest" href="assets/site.webmanifest"/>
    <link rel="preconnect" href="http://api-agendamento.teste"/>
    <link rel="dns-prefetch" href="http://api-agendamento.teste"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet"/>
    <title>Ordens de Serviço — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
    <script defer src="js/Alpine.js"></script>

    <style>[x-cloak] { display: none !important; } body { font-family: 'Roboto', sans-serif; }</style>
  </head>
  <body class="bg-gray-50" x-data="ordensServicoApp">
    <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
      <a href="dashboard.html" class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5" aria-label="Voltar ao painel">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium hidden sm:inline">Painel</span>
      </a>
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <span class="font-semibold text-gray-900 text-sm">Ordens de Serviço</span>
      </div>
      <div class="flex items-center gap-1.5 ml-auto">
        <div class="relative" x-data="{ avatarOpen: false }">
          <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
            <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
          </button>
          <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
            <div class="px-4 py-2.5 border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
              <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
              }" x-text="getUserRoleLabel()"></span>
            </div>
            <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="min-h-screen pt-14">
      <div class="p-4 lg:p-6 max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Ordens de Serviço</h2>
            <p class="text-sm text-gray-400 mt-0.5">Acompanhamento operacional e consumo de insumos por atendimento</p>
          </div>
          <button @click="openNewOrderForm()" class="text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors shadow-sm" style="background-color: #f97316; color: #ffffff;">
            + Nova O.S.
          </button>
        </div>

        <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500 mx-auto"></div>
          <p class="text-sm font-medium text-gray-500 mt-4">Carregando ordens de serviço...</p>
        </div>

        <!-- Barra de Busca e Filtros -->
        <div class="flex flex-col sm:flex-row gap-3 mb-5">
          <div class="relative flex-1">
            <input type="text" x-model="orderSearch" placeholder="Buscar por número, cliente, profissional ou serviço..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all"/>
          </div>
          <div class="flex items-center gap-2">
            <select x-model="statusFilter" class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
              <option value="all">Todos os Status</option>
              <option value="in_progress">Em Andamento</option>
              <option value="completed">Concluída</option>
              <option value="cancelled">Cancelada</option>
              <option value="pending">Pendente</option>
            </select>
          </div>
        </div>

        <div x-show="!loading && filteredOrders().length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <p class="text-3xl mb-2">🛠️</p>
          <p class="text-sm font-medium text-gray-500" x-text="orderSearch || statusFilter !== 'all' ? 'Nenhuma Ordem de Serviço encontrada para os filtros aplicados' : 'Nenhuma Ordem de Serviço registrada'"></p>
        </div>

        <div class="space-y-3" x-show="!loading && filteredOrders().length > 0">
          <template x-for="os in paginatedOrders()" :key="os.id">
            <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-bold text-gray-900 text-sm" x-text="'OS #' + os.id + ' — ' + (os.client_name || 'Cliente')"></span>
                  <span class="text-xs font-bold px-2 py-0.5 rounded-full" :class="{
                    'bg-amber-50 text-amber-700 border border-amber-100': os.status === 'in_progress',
                    'bg-emerald-50 text-emerald-700 border border-emerald-100': os.status === 'completed',
                    'bg-red-50 text-red-700 border border-red-100': os.status === 'cancelled',
                    'bg-gray-100 text-gray-600': os.status === 'pending'
                  }" x-text="os.status === 'in_progress' ? 'Em Andamento' : (os.status === 'completed' ? 'Concluída' : os.status)"></span>
                </div>
                <p class="text-xs text-gray-400" x-text="'Profissional: ' + (os.professional_name || 'Profissional') + (os.service_name ? ' • Serviço: ' + os.service_name : '') + ' • Início: ' + (os.started_at || 'Não iniciado')"></p>
                <p x-show="os.items && os.items.length > 0" class="text-xs text-indigo-600 font-medium mt-1" x-text="'Insumos consumidos: ' + os.items.length + ' item(ns)'"></p>
              </div>

              <div class="flex items-center gap-2 self-start sm:self-auto">
                <a :href="'faturas.html?serviceOrderId=' + os.id + '&appointmentId=' + (os.appointment_id || '') + '&clientId=' + (os.client_id || '') + '&name=' + encodeURIComponent(os.client_name || '') + '&service=' + encodeURIComponent(os.service_name || '')" class="text-xs bg-blue-50 text-blue-700 font-semibold px-3 py-2 rounded-xl hover:bg-blue-100 transition-colors">
                  Fatura
                </a>
                <button @click="openEditOrderForm(os)" class="text-xs bg-gray-100 text-gray-700 font-semibold px-3 py-2 rounded-xl hover:bg-gray-200 transition-colors">
                  Ver / Editar
                </button>
              </div>
            </div>
          </template>

          <!-- Sentinela de Rolagem Infinita Ordens de Serviço -->
          <div x-show="hasMoreOrders()" 
               x-init="createInfiniteScrollObserver($el, () => loadMoreOrders())" 
               class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-orange-500"></div>
            <span>Carregando mais ordens de serviço...</span>
          </div>

          <!-- Rodapé de Contagem Ordens de Serviço -->
          <div x-show="!loading && filteredOrders().length > 0" class="text-center py-3 text-xs text-gray-400">
            <span x-text="'Exibindo ' + Math.min(displayedCount, filteredOrders().length) + ' de ' + filteredOrders().length + ' ordens de serviço'"></span>
          </div>
        </div>
      </div>

      <!-- Modal Ordem de Serviço -->
      <div x-show="openFormOrder" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
        <div @click.outside="openFormOrder = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 class="font-bold text-gray-900" x-text="formOrder.id ? 'Editar Ordem de Serviço #' + formOrder.id : 'Nova Ordem de Serviço'"></h3>
            <button @click="openFormOrder = false" class="text-gray-400 hover:text-gray-600">✕</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Cliente *</label>
              <select x-model="formOrder.client_id" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                <template x-for="c in clients" :key="c.id">
                  <option :value="c.id" x-text="c.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Profissional *</label>
              <select x-model="formOrder.professional_id" :disabled="!hasPermission(['admin', 'receptionist'])" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                <template x-for="p in professionals" :key="p.id">
                  <option :value="p.id" x-text="p.name"></option>
                </template>
              </select>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Serviço Prestado *</label>
            <select x-model="formOrder.service_id" @change="onServiceChange()" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
              <template x-for="s in services" :key="s.id">
                <option :value="s.id" x-text="s.name + (s.price ? ' (R$ ' + parseFloat(s.price).toFixed(2) + ')' : '')"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Status *</label>
            <select x-model="formOrder.status" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
              <option value="pending">Pendente</option>
              <option value="in_progress">Em Andamento</option>
              <option value="completed">Concluída</option>
              <option value="cancelled">Cancelada</option>
            </select>
          </div>

          <!-- Insumos Consumidos -->
          <div class="border-t border-gray-100 pt-3">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-bold text-gray-900 uppercase">Insumos / Produtos Usados</label>
              <button @click="addItemToOrder()" class="text-xs font-bold px-2.5 py-1 rounded-lg transition-colors" style="background-color: #fff7ed; color: #c2410c;">+ Insumo</button>
            </div>

            <div class="space-y-2">
              <template x-for="(item, idx) in formOrder.items" :key="idx">
                <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl">
                  <select x-model="item.product_id" @change="onProductChange(idx)" class="flex-1 border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-900 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                    <template x-for="p in products" :key="p.id">
                      <option :value="p.id" x-text="p.name"></option>
                    </template>
                  </select>
                  <input type="number" min="1" x-model="item.quantity" class="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs text-center bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Qtd"/>
                  <button @click="removeItemFromOrder(idx)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg text-xs">✕</button>
                </div>
              </template>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Observações do Atendimento</label>
            <textarea x-model="formOrder.notes" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" rows="2" placeholder="Detalhes técnicos do procedimento..."></textarea>
          </div>

          <div class="flex gap-3 pt-2">
            <button @click="openFormOrder = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-200 text-sm">Cancelar</button>
            <a x-show="formOrder.id" :href="'faturas.html?serviceOrderId=' + formOrder.id + '&appointmentId=' + (formOrder.appointment_id || '') + '&clientId=' + (formOrder.client_id || '')" class="flex-1 bg-blue-50 text-blue-700 font-bold py-2.5 rounded-xl hover:bg-blue-100 text-sm text-center block flex items-center justify-center">Gerar Fatura</a>
            <button @click="postServiceOrder()" class="flex-1 font-bold py-2.5 rounded-xl text-sm shadow-sm transition-colors" style="background-color: #f97316; color: #ffffff;">Salvar O.S.</button>
          </div>
        </div>
      </div>
    </main>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end"></div>
    <script src="js/utils.js"></script>
    <script src="js/ordens-servico.js"></script>
  </body>
</html>
