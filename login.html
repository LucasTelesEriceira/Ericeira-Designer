<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png"/>
    <link rel="manifest" href="/assets/site.webmanifest"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"/>
    <link rel="preconnect" href="https://lightslategrey-guanaco-998055.hostingersite.com" crossorigin/>
    <link rel="dns-prefetch" href="https://lightslategrey-guanaco-998055.hostingersite.com"/>
    <title>Acesso Administrativo — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css" data-pg-name="TailwindCSS"/>
    <script defer src="js/Alpine.js" data-pg-name="AlpineJs"></script>
    <style>
      [x-cloak] { display: none !important; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .brand-font {
        font-family: 'Playfair Display', serif;
      }
      .ambient-glow {
        background: radial-gradient(circle at 50% 20%, rgba(244, 114, 182, 0.18), rgba(251, 207, 232, 0.08) 45%, transparent 70%);
      }
      .card-glass {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
    </style>
  </head>

  <body x-data="loginForm()" class="min-h-screen bg-gradient-to-br from-rose-50/60 via-gray-50 to-pink-50/70 text-gray-800 flex flex-col justify-between relative overflow-x-hidden selection:bg-pink-500 selection:text-white">
    <!-- Efeito luminoso suave no topo -->
    <div class="ambient-glow absolute inset-0 pointer-events-none z-0"></div>

    <!-- Barra de navegação minimalista do topo -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="agendamento.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-500 hover:text-pink-600 transition-colors py-1.5 px-3 rounded-full hover:bg-white/80 border border-transparent hover:border-pink-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Voltar ao agendamento</span>
      </a>

      <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-full">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Ambiente Seguro SSL
      </span>
    </header>

    <!-- Conteúdo Central / Card de Login -->
    <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6">
      <div class="w-full max-w-md">
        <div class="card-glass border border-pink-100/90 rounded-3xl p-7 sm:p-9 shadow-2xl shadow-pink-500/10 relative">
          <!-- Cabeçalho do Card -->
          <div class="text-center mb-7">
            <div class="mx-auto mb-4 h-16 w-16 rounded-2xl bg-gradient-to-br from-pink-500 via-rose-500 to-pink-600 p-0.5 shadow-lg shadow-pink-500/25 flex items-center justify-center transform hover:scale-105 transition-transform duration-300">
              <div class="h-full w-full bg-white rounded-[14px] flex items-center justify-center p-2.5">
                <img src="assets/Ericeira DesignerIII.svg" alt="Ericeira Designer" class="h-full w-full object-contain"/>
              </div>
            </div>

            <h1 class="brand-font text-2xl sm:text-3xl font-semibold text-gray-900 tracking-tight">Ericeira Designer</h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1 font-medium">Painel de Gestão e Atendimento</p>
          </div>

          <!-- Alerta de Bloqueio por Tentativas ou Mensagem de Erro -->
          <div x-show="errorMessage" x-cloak class="mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200/80 text-red-700 text-xs font-medium flex items-start gap-2.5 animate-fadeIn">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 mt-0.5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div class="flex-1 leading-relaxed" x-text="errorMessage"></div>
          </div>

          <!-- Formulário -->
          <form @submit.prevent="login()" class="space-y-4" novalidate>
            <!-- Campo Usuário -->
            <div>
              <label for="username" class="block text-xs font-semibold text-gray-700 mb-1.5 ml-1">Usuário ou E-mail</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
                <input 
                  id="username"
                  x-model="username" 
                  type="text" 
                  class="block w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 bg-gray-50/50 text-sm text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 transition-all" 
                  placeholder="Seu usuário" 
                  autocomplete="username" 
                  autocorrect="off" 
                  autocapitalize="none" 
                  spellcheck="false" 
                  required
                />
              </div>
            </div>

            <!-- Campo Senha -->
            <div>
              <div class="flex items-center justify-between mb-1.5 ml-1">
                <label for="password" class="block text-xs font-semibold text-gray-700">Senha</label>
                <!-- Aviso de Caps Lock -->
                <span x-show="capsLockOn" x-cloak class="inline-flex items-center gap-1 text-[11px] font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                  </svg>
                  Caps Lock ligado
                </span>
              </div>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </div>
                <input 
                  id="password"
                  x-model="password" 
                  :type="showPassword ? 'text' : 'password'" 
                  @keydown="handleKeydown($event)"
                  @keyup="handleKeyup($event)"
                  class="block w-full pl-10 pr-11 py-3 rounded-2xl border border-gray-200 bg-gray-50/50 text-sm text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/10 transition-all" 
                  placeholder="••••••••" 
                  autocomplete="current-password" 
                  required
                />
                <!-- Botão Alternar Visibilidade da Senha -->
                <button 
                  type="button" 
                  @click="showPassword = !showPassword" 
                  class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none focus:text-pink-600"
                  :title="showPassword ? 'Ocultar senha' : 'Ver senha'"
                  tabindex="-1">
                  <!-- Olho aberto -->
                  <svg x-show="!showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                  <!-- Olho fechado / riscado -->
                  <svg x-show="showPassword" x-cloak class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Opções auxiliares: Lembrar usuário -->
            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 cursor-pointer select-none">
                <input 
                  type="checkbox" 
                  x-model="rememberMe" 
                  class="h-4 w-4 rounded-md border-gray-300 text-pink-600 focus:ring-pink-500 cursor-pointer"
                />
                <span class="text-xs font-medium text-gray-600">Lembrar meu usuário</span>
              </label>
            </div>

            <!-- Botão de Login -->
            <div class="pt-2">
              <button 
                type="submit" 
                :disabled="loading || lockoutTimer > 0"
                class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 hover:from-pink-600 hover:to-rose-600 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-pink-500/25 hover:shadow-pink-500/35 active:scale-[0.99] disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none transition-all duration-200">
                <!-- Spinner de carregamento -->
                <svg x-show="loading" x-cloak class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>

                <span x-text="loading ? 'Validando acesso...' : (lockoutTimer > 0 ? 'Aguarde ' + lockoutTimer + 's' : 'Entrar no Sistema')"></span>

                <!-- Seta de ação quando ocioso -->
                <svg x-show="!loading && lockoutTimer <= 0" class="h-4 w-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
              </button>
            </div>
          </form>

          <!-- Selo de Rodapé Interno -->
          <div class="mt-6 pt-5 border-t border-gray-100 flex items-center justify-center gap-1.5 text-[11px] text-gray-400 font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <span>Autenticação criptografada via Token JWT</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Rodapé da Página -->
    <footer class="relative z-10 w-full text-center py-4 text-xs text-gray-400">
      <p>&copy; 2026 Ericeira Designer • Todos os direitos reservados.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
