<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
    <link rel="manifest" href="assets/site.webmanifest"/>
    <link rel="preconnect" href="http://api-agendamento.teste"/>
    <link rel="dns-prefetch" href="http://api-agendamento.teste"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet"/>
    <title>Produtos & Estoque — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
    <script defer src="js/Alpine.js"></script>

    <style>[x-cloak] { display: none !important; } body { font-family: 'Roboto', sans-serif; }</style>
  </head>
  <body class="bg-gray-50" x-data="produtosApp">
    <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
      <a href="dashboard.html" class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5" aria-label="Voltar ao painel">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium hidden sm:inline">Painel</span>
      </a>
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <span class="font-semibold text-gray-900 text-sm">Produtos & Estoque</span>
      </div>
      <div class="flex items-center gap-1.5 ml-auto">
        <div class="relative" x-data="{ avatarOpen: false }">
          <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
            <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
          </button>
          <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
            <div class="px-4 py-2.5 border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
              <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
              }" x-text="getUserRoleLabel()"></span>
            </div>
            <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="min-h-screen pt-14">
      <div class="p-4 lg:p-6 max-w-4xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Produtos & Estoque</h2>
            <p class="text-sm text-gray-400 mt-0.5">Controle de catálogo, preços e movimentações de estoque</p>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openNewMovementForm()" class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3.5 py-2.5 rounded-xl hover:bg-indigo-100 transition-colors">
              + Movimentação
            </button>
            <button @click="openNewProductForm()" class="bg-pink-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-pink-600 transition-colors">
              + Novo Produto
            </button>
          </div>
        </div>

        <!-- Abas -->
        <div class="flex border-b border-gray-200 mb-5 gap-6">
          <button @click="activeTab = 'products'" class="pb-3 text-sm font-semibold border-b-2 transition-colors" :class="activeTab === 'products' ? 'border-pink-500 text-pink-600' : 'border-transparent text-gray-400 hover:text-gray-600'">
            Catálogo de Produtos (<span x-text="products.length"></span>)
          </button>
          <button @click="activeTab = 'movements'" class="pb-3 text-sm font-semibold border-b-2 transition-colors" :class="activeTab === 'movements' ? 'border-pink-500 text-pink-600' : 'border-transparent text-gray-400 hover:text-gray-600'">
            Histórico de Movimentações (<span x-text="movements.length"></span>)
          </button>
        </div>

        <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mx-auto"></div>
          <p class="text-sm font-medium text-gray-500 mt-4">Carregando estoque...</p>
        </div>

        <!-- Lista de Produtos -->
        <div x-show="!loading && activeTab === 'products'">
          <div class="mb-4">
            <input type="text" x-model="productSearch" placeholder="Buscar produto por nome ou descrição..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all"/>
          </div>

          <div x-show="filteredProducts().length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
            <p class="text-3xl mb-2">📦</p>
            <p class="text-sm font-medium text-gray-500" x-text="productSearch ? 'Nenhum produto encontrado para a busca' : 'Nenhum produto cadastrado'"></p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="p in paginatedProducts()" :key="p.id">
              <div class="bg-white rounded-2xl border border-gray-200 p-5 flex flex-col justify-between shadow-sm relative group">
                <button @click="deleteProduct(p.id)" class="absolute top-3 right-3 p-1.5 rounded-lg text-gray-300 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100 transition-all">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full" :class="parseInt(p.stock_quantity) <= parseInt(p.minimum_stock) ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-emerald-50 text-emerald-700 border border-emerald-100'" x-text="'Estoque: ' + p.stock_quantity + ' un'"></span>
                  </div>
                  <h3 class="font-bold text-gray-900 text-sm leading-snug" x-text="p.name"></h3>
                  <p x-show="p.description" class="text-xs text-gray-400 mt-1 line-clamp-2" x-text="p.description"></p>
                </div>
                <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                  <div>
                    <p class="text-xs text-gray-400">Preço de Venda</p>
                    <p class="font-bold text-sm text-gray-900" x-text="formatCurrency(p.sale_price)"></p>
                  </div>
                  <div class="flex gap-1">
                    <button @click="openNewMovementForm(p)" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors">+ Saldo</button>
                    <button @click="openEditProductForm(p)" class="text-xs bg-gray-100 text-gray-700 font-semibold px-2.5 py-1.5 rounded-lg hover:bg-gray-200 transition-colors">Editar</button>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Sentinela de Rolagem Infinita Produtos -->
          <div x-show="hasMoreProducts()" 
               x-init="createInfiniteScrollObserver($el, () => loadMoreProducts())" 
               class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-pink-500"></div>
            <span>Carregando mais produtos...</span>
          </div>

          <!-- Rodapé de Contagem Produtos -->
          <div x-show="!loading && filteredProducts().length > 0" class="text-center py-3 text-xs text-gray-400">
            <span x-text="'Exibindo ' + Math.min(displayedProductsCount, filteredProducts().length) + ' de ' + filteredProducts().length + ' produtos'"></span>
          </div>
        </div>

        <!-- Histórico de Movimentações -->
        <div x-show="!loading && activeTab === 'movements'">
          <div class="mb-4">
            <input type="text" x-model="movementSearch" placeholder="Buscar movimentação por produto, tipo ou nota..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all"/>
          </div>

          <div x-show="filteredMovements().length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
            <p class="text-3xl mb-2">📊</p>
            <p class="text-sm font-medium text-gray-500" x-text="movementSearch ? 'Nenhuma movimentação encontrada para a busca' : 'Nenhuma movimentação registrada'"></p>
          </div>
          <div class="space-y-3">
            <template x-for="m in paginatedMovements()" :key="m.id">
              <div class="bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="h-9 w-9 rounded-xl flex items-center justify-center text-sm font-bold" :class="m.type === 'purchase' || m.type === 'return' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'">
                    <span x-text="m.type === 'purchase' || m.type === 'return' ? '+' : '-'"></span>
                  </div>
                  <div>
                    <p class="font-semibold text-sm text-gray-900" x-text="m.product_name || 'Produto'"></p>
                    <p class="text-xs text-gray-400" x-text="'Tipo: ' + m.type + (m.notes ? ' • ' + m.notes : '')"></p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="font-bold text-sm" :class="m.type === 'purchase' || m.type === 'return' ? 'text-emerald-600' : 'text-red-600'" x-text="(m.type === 'purchase' || m.type === 'return' ? '+' : '-') + m.quantity + ' un'"></p>
                  <p class="text-xs text-gray-400" x-text="formatDate(m.created_at ? m.created_at.split(' ')[0] : '')"></p>
                </div>
              </div>
            </template>
          </div>

          <!-- Sentinela de Rolagem Infinita Movimentações -->
          <div x-show="hasMoreMovements()" 
               x-init="createInfiniteScrollObserver($el, () => loadMoreMovements())" 
               class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-pink-500"></div>
            <span>Carregando mais movimentações...</span>
          </div>

          <!-- Rodapé de Contagem Movimentações -->
          <div x-show="!loading && filteredMovements().length > 0" class="text-center py-3 text-xs text-gray-400">
            <span x-text="'Exibindo ' + Math.min(displayedMovementsCount, filteredMovements().length) + ' de ' + filteredMovements().length + ' movimentações'"></span>
          </div>
        </div>
      </div>

      <!-- Modal Produto -->
      <div x-show="openFormProduct" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
        <div @click.outside="openFormProduct = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 class="font-bold text-gray-900" x-text="formProduct.id ? 'Editar Produto' : 'Novo Produto'"></h3>
            <button @click="openFormProduct = false" class="text-gray-400 hover:text-gray-600">✕</button>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Nome do Produto *</label>
            <input type="text" x-model="formProduct.name" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Ex: Sérum Hidratante Facial"/>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Preço de Venda (R$) *</label>
              <input type="number" step="0.01" x-model="formProduct.sale_price" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="85.00"/>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Preço de Custo (R$)</label>
              <input type="number" step="0.01" x-model="formProduct.cost_price" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="35.00"/>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Estoque Inicial</label>
              <input type="number" x-model="formProduct.stock_quantity" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="10"/>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Estoque Mínimo</label>
              <input type="number" x-model="formProduct.minimum_stock" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="5"/>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Descrição</label>
            <textarea x-model="formProduct.description" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" rows="2" placeholder="Detalhes do produto..."></textarea>
          </div>
          <div class="flex gap-3 pt-2">
            <button @click="openFormProduct = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-200 text-sm">Cancelar</button>
            <button @click="postProduct()" class="flex-1 bg-pink-500 text-white font-bold py-2.5 rounded-xl hover:bg-pink-600 text-sm">Salvar</button>
          </div>
        </div>
      </div>

      <!-- Modal Movimentação -->
      <div x-show="openFormMovement" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
        <div @click.outside="openFormMovement = false" class="bg-white w-full lg:max-w-md lg:rounded-2xl rounded-t-2xl p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 class="font-bold text-gray-900">Lançar Movimentação de Estoque</h3>
            <button @click="openFormMovement = false" class="text-gray-400 hover:text-gray-600">✕</button>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Produto *</label>
            <select x-model="formMovement.product_id" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
              <template x-for="p in products" :key="p.id">
                <option :value="p.id" x-text="p.name + ' (Saldo: ' + p.stock_quantity + ')'"></option>
              </template>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Tipo de Movimentação *</label>
              <select x-model="formMovement.type" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                <option value="purchase">Compra (Entrada)</option>
                <option value="consumption">Consumo Interno (Saída)</option>
                <option value="loss">Perda/Avaria (Saída)</option>
                <option value="adjustment">Ajuste Manual</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Quantidade *</label>
              <input type="number" min="1" x-model="formMovement.quantity" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="1"/>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Observações</label>
            <input type="text" x-model="formMovement.notes" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Motivo ou número da nota de compra..."/>
          </div>
          <div class="flex gap-3 pt-2">
            <button @click="openFormMovement = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-200 text-sm">Cancelar</button>
            <button @click="postMovement()" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 text-sm">Registrar</button>
          </div>
        </div>
      </div>
    </main>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end"></div>
    <script src="js/utils.js"></script>
    <script src="js/produtos.js"></script>
  </body>
</html>
