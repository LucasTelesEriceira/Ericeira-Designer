<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
        <link rel="manifest" href="assets/site.webmanifest"/>
        <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet"/>
        <title>Clientes — Ericeira Designer</title>
        <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
        <script defer src="js/Alpine.js"></script>
        <script src="js/Alpine-Mask.js"></script>
        <style>[x-cloak] { display: none !important; } body { font-family: 'Roboto', sans-serif; }</style>
    </head>
    <body class="bg-gray-50" x-data="clientesApp">
        <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
            <a href="dashboard.html" class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5" aria-label="Voltar ao painel">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="text-sm font-medium hidden sm:inline">Painel</span>
            </a>
            <div class="flex items-center gap-2 min-w-0 flex-1">
                <span class="font-semibold text-gray-900 text-sm">Clientes</span>
            </div>
            <div class="flex items-center gap-1.5 ml-auto">
                <div class="relative" x-data="{ avatarOpen: false }">
                    <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
                    </button>
                    <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
                        <div class="px-4 py-2.5 border-b border-gray-100">
                            <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
                            <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                                'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                                'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                                'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
                            }" x-text="getUserRoleLabel()"></span>
                        </div>
                        <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="min-h-screen pt-14">
            <div class="p-4 lg:p-6 max-w-4xl mx-auto">
                <div class="flex items-center justify-between mb-5">
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">Clientes</h2>
                        <p class="text-sm text-gray-400 mt-0.5">Gerencie os contatos cadastrados</p>
                    </div>
                    <button @click="openNewClientForm()" class="bg-purple-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-purple-700 transition-colors">
                        + Novo cliente
                    </button>
                </div>

                <div class="mb-4">
                    <input type="text" x-model="clientSearch" placeholder="Buscar por nome ou WhatsApp..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 shadow-sm focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                </div>

                <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto"></div>
                    <p class="text-sm font-medium text-gray-500 mt-4">Carregando clientes...</p>
                </div>

                <div x-show="!loading && filteredClients().length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
                    <p class="text-3xl mb-2">👤</p>
                    <p class="text-sm font-medium text-gray-500">Nenhum cliente encontrado</p>
                </div>

                <div class="space-y-3" x-show="!loading">
                    <template x-for="client in paginatedClients()" :key="client.id">
                        <div class="bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between shadow-sm hover:border-purple-200 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 font-bold flex items-center justify-center text-sm" x-text="client.name.charAt(0).toUpperCase()"></div>
                                <div>
                                    <span class="font-bold text-gray-900 text-sm block" x-text="client.name"></span>
                                    <span class="text-xs text-gray-400" x-text="client.whatsapp"></span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button @click="openClientHistory(client)" class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors" title="Ver Histórico">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </button>
                                <button @click="openEditClientForm(client)" class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors" title="Editar">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                </button>
                                <button @click="deleteClient(client.id)" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </div>
                    </template>

                    <!-- Sentinela de Rolagem Infinita -->
                    <div x-show="hasMoreClients()" 
                         x-init="createInfiniteScrollObserver($el, () => loadMoreClients())" 
                         class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-purple-600"></div>
                        <span>Carregando mais clientes...</span>
                    </div>

                    <!-- Rodapé de Contagem -->
                    <div x-show="!loading && filteredClients().length > 0" class="text-center py-3 text-xs text-gray-400">
                        <span x-text="'Exibindo ' + Math.min(displayedCount, filteredClients().length) + ' de ' + filteredClients().length + ' clientes'"></span>
                    </div>
                </div>
            </div>

            <!-- Modal Formulário Cliente -->
            <div x-show="openClientForm" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
                <div @click.outside="openClientForm = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <h3 class="font-bold text-gray-900" x-text="editingClient ? 'Editar Cliente' : 'Novo Cliente'"></h3>
                        <button @click="openClientForm = false" class="text-gray-400 hover:text-gray-600">✕</button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-semibold text-gray-700 mb-1.5 block">Nome *</label>
                            <input type="text" x-model="clientFormName" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.name ? 'border-red-400' : 'border-gray-200'" placeholder="Nome do cliente">
                            <p x-show="errors.name" x-text="errors.name" class="text-xs text-red-500 mt-1"></p>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-700 mb-1.5 block">WhatsApp *</label>
                            <input type="text" x-model="clientFormWhatsapp" x-mask="(99) 99999-9999" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.whatsapp ? 'border-red-400' : 'border-gray-200'" placeholder="(11) 99999-9999">
                            <p x-show="errors.whatsapp" x-text="errors.whatsapp" class="text-xs text-red-500 mt-1"></p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-gray-700 mb-1.5 block">CPF</label>
                                <input type="text" x-model="clientFormCpf" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="000.000.000-00">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-700 mb-1.5 block">Data de Nascimento</label>
                                <input type="date" x-model="clientFormBirthDate" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-700 mb-1.5 block">E-mail</label>
                            <input type="email" x-model="clientFormEmail" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="cliente@email.com">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-700 mb-1.5 block">Observações</label>
                            <textarea x-model="clientFormNotes" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Anotações internas..." rows="3"></textarea>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button @click="openClientForm = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-200 transition-colors text-sm">Cancelar</button>
                            <button @click="saveClient()" class="flex-1 bg-purple-600 text-white font-bold py-3 rounded-xl hover:bg-purple-700 transition-colors text-sm" x-text="editingClient ? 'Salvar' : 'Criar'"></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Histórico -->
            <div x-show="openHistory" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
                <div @click.outside="openHistory = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <div>
                            <h3 class="font-bold text-gray-900" x-text="'Histórico — ' + (historyClient ? historyClient.name : '')"></h3>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="filteredHistory().length + ' atendimento(s) encontrado(s)'"></p>
                        </div>
                        <button @click="openHistory = false" class="text-gray-400 hover:text-gray-600">✕</button>
                    </div>

                    <!-- Filtros de Serviço e Profissional -->
                    <div class="grid grid-cols-2 gap-2" x-show="historySchedulings.length > 0">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1">Serviço</label>
                            <select x-model="historyServiceFilter" @change="historyPage = 1" class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-900 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                                <option value="">Todos os Serviços</option>
                                <template x-for="svc in historyServices" :key="svc">
                                    <option :value="svc" x-text="svc"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1">Profissional</label>
                            <select x-model="historyProfessionalFilter" @change="historyPage = 1" class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-900 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                                <option value="">Todos os Profissionais</option>
                                <template x-for="prof in historyProfessionals" :key="prof">
                                    <option :value="prof" x-text="prof"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div x-show="historySchedulings.length === 0" class="text-center py-8 text-gray-400 text-sm">
                        Nenhum agendamento encontrado para este cliente.
                    </div>

                    <div x-show="historySchedulings.length > 0 && filteredHistory().length === 0" class="text-center py-6 text-gray-400 text-sm">
                        Nenhum atendimento corresponde aos filtros selecionados.
                    </div>

                    <!-- Lista de Atendimentos Paginada -->
                    <div class="space-y-2" x-show="filteredHistory().length > 0">
                        <template x-for="s in paginatedHistory()" :key="s.id">
                            <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 text-xs hover:border-purple-200 transition-colors">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="font-bold text-gray-900" x-text="s.service"></span>
                                    <span class="font-semibold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full border border-purple-100" x-text="s.date + ' às ' + s.time"></span>
                                </div>
                                <p class="text-gray-400" x-text="'Profissional: ' + (s.professional_name || s.professional || 'Não especificado')"></p>
                            </div>
                        </template>
                    </div>

                    <!-- Paginação do Histórico -->
                    <div x-show="historyTotalPages() > 1" class="flex items-center justify-between pt-3 border-t border-gray-100 text-xs">
                        <button @click="historyPrevPage()" :disabled="historyPage === 1" class="px-3 py-1.5 rounded-lg border border-gray-200 font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            ← Anterior
                        </button>
                        <span class="text-gray-500 font-medium" x-text="'Página ' + historyPage + ' de ' + historyTotalPages()"></span>
                        <button @click="historyNextPage()" :disabled="historyPage === historyTotalPages()" class="px-3 py-1.5 rounded-lg border border-gray-200 font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            Próxima →
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end"></div>
        <script src="js/utils.js"></script>
        <script src="js/clientes.js"></script>
    </body>
</html>
