<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
    <link rel="manifest" href="assets/site.webmanifest"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet"/>
    <title>Faturas — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
    <script defer src="js/Alpine.js"></script>
    <style>[x-cloak] { display: none !important; } body { font-family: 'Roboto', sans-serif; } .nav-card { transition: transform 0.15s ease,
          box-shadow 0.15s ease; } .nav-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); } .nav-card:active { transform: translateY(0); }</style>
  </head>

  <body class="bg-gray-50" x-data="faturasApp">
    <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
      <a href="dashboard.html" class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5" aria-label="Voltar ao painel">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium hidden sm:inline">Painel</span>
      </a>
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <span class="font-semibold text-gray-900 text-sm">Faturas</span>
      </div>
      <div class="flex items-center gap-1.5 ml-auto">
        <div class="relative" x-data="{ avatarOpen: false }">
          <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
            <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
          </button>
          <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
            <div class="px-4 py-2.5 border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
              <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
              }" x-text="getUserRoleLabel()"></span>
            </div>
            <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="min-h-screen pt-14">
      <div class="p-4 lg:p-6 max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Faturas</h2>
            <p class="text-sm text-gray-400 mt-0.5">
              Receitas e controle de pagamentos
            </p>
          </div>
          <button @click="openInvoiceForm()" class="flex items-center gap-2 bg-pink-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-pink-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            Nova fatura
          </button>
        </div>

        <div class="mb-5" x-show="inputInvoice.length > 0">
          <input type="text" x-model="invoiceSearch" placeholder="Buscar por cliente, serviço ou OS..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
        </div>

        <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mx-auto"></div>
          <p class="text-sm font-medium text-gray-500 mt-4">Carregando faturas...</p>
        </div>
        <div x-show="!loading && filteredInvoices().length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <p class="text-3xl mb-2">💰</p>
          <p class="text-sm font-medium text-gray-500" x-text="invoiceSearch ? 'Nenhuma fatura encontrada para esta busca' : 'Nenhuma fatura registrada'"></p>
        </div>

        <div class="space-y-3" x-show="!loading">
          <template x-for="(invoice, index) in paginatedInvoices()" :key="invoice.id || index">
            <div class="bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between shadow-sm hover:border-pink-200 transition-colors">
              <!-- Esquerda: Avatar com Inicial + Nome do Cliente e Detalhes -->
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-sm flex-shrink-0" x-text="invoice.nome ? invoice.nome.charAt(0).toUpperCase() : 'F'"></div>
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold text-gray-900 text-sm truncate" x-text="invoice.nome"></span>
                    <span x-show="invoice.service_order_id" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-100" x-text="'OS #' + invoice.service_order_id"></span>
                  </div>
                  <div class="flex items-center gap-1.5 text-xs text-gray-400 mt-0.5 flex-wrap">
                    <span x-show="invoice.service_name" class="inline-block bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium text-[11px]" x-text="invoice.service_name"></span>
                    <span x-show="invoice.service_name && invoice.transactionDate" class="text-gray-300">•</span>
                    <span x-show="invoice.transactionDate" x-text="formatDate(invoice.transactionDate)"></span>
                    <span class="text-gray-300">•</span>
                    <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full" :class="{
                      'bg-emerald-50 text-emerald-700 border border-emerald-100': invoice.status === 'confirmed' || invoice.status === 'completed',
                      'bg-amber-50 text-amber-700 border border-amber-100': invoice.status === 'pending',
                      'bg-red-50 text-red-700 border border-red-100 line-through': invoice.status === 'cancelled',
                      'bg-rose-50 text-rose-700 border border-rose-100': invoice.status === 'refunded'
                    }" x-text="invoice.status === 'confirmed' || invoice.status === 'completed' ? 'Recebido' : (invoice.status === 'refunded' ? 'Estornado' : (invoice.status === 'pending' ? 'Pendente' : invoice.status))"></span>
                  </div>
                </div>
              </div>

              <!-- Direita: Valor em Destaque + Botões de Ação (Editar e Excluir) -->
              <div class="flex items-center gap-1 sm:gap-2 flex-shrink-0 ml-3">
                <span class="font-bold text-emerald-600 text-sm sm:text-base mr-1" x-text="formatCurrency(invoice.valueReceived)"></span>
                <button @click="openInvoiceForm(invoice)" class="p-2 text-gray-400 hover:text-pink-600 hover:bg-pink-50 rounded-lg transition-colors" title="Editar Fatura">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                  </svg>
                </button>
                <button @click="deleteOrCancelInvoice(invoice)" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir ou Estornar Fatura">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </div>
          </template>

          <!-- Sentinela de Rolagem Infinita -->
          <div x-show="hasMoreInvoices()" 
               x-init="createInfiniteScrollObserver($el, () => loadMoreInvoices())" 
               class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-pink-500"></div>
            <span>Carregando mais faturas...</span>
          </div>

          <!-- Rodapé de Contagem -->
          <div x-show="!loading && filteredInvoices().length > 0" class="text-center py-3 text-xs text-gray-400">
            <span x-text="'Exibindo ' + Math.min(displayedCount, filteredInvoices().length) + ' de ' + filteredInvoices().length + ' faturas'"></span>
          </div>
        </div>
      </div>

      <!-- Modal Invoice Form -->
      <div x-show="openFormInvoice" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
        <div @click.outside="openFormInvoice = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-full lg:translate-y-0 lg:scale-95" x-transition:enter-end="translate-y-0 lg:scale-100">
          <div class="sticky top-0 bg-white border-b border-gray-100 px-5 py-4 flex items-center justify-between z-10">
            <h3 class="font-bold text-gray-900" x-text="formInputInvoice.id ? 'Editar fatura' : 'Nova fatura'"></h3>
            <button @click="openFormInvoice = false" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="p-5 space-y-4">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1.5 block">
                Cliente *
              </label>
              <select x-model="formInputInvoice.client_id" @change="onClientChange()" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.nome ? 'border-red-400' : 'border-gray-200'">
                <option value="">Selecione um cliente...</option>
                <template x-for="c in clients" :key="c.id">
                  <option :value="c.id" x-text="c.name + (c.whatsapp ? ' (' + c.whatsapp + ')' : '')"></option>
                </template>
              </select>
              <p x-show="errors.nome" x-text="errors.nome" class="text-xs text-red-500 mt-1"></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="col-span-2">
                <label class="text-xs font-semibold text-gray-700 mb-1.5 block">
                  Data
                </label>
                <input type="date" x-model="formInputInvoice.transactionDate" @input="clearInvoiceError('transactionDate')" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.transactionDate ? 'border-red-400' : 'border-gray-200'"/>
                <p x-show="errors.transactionDate" x-text="errors.transactionDate" class="text-xs text-red-500 mt-1"></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-gray-700 mb-1.5 block">
                  Método de pagamento
                </label>
                <select x-model="formInputInvoice.paymentMethod" @change="clearInvoiceError('paymentMethod')" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.paymentMethod ? 'border-red-400' : 'border-gray-200'">
                  <option value="">Selecione...</option>
                  <template x-for="pm in paymentMethods" :key="pm.value">
                    <option :value="pm.value" x-text="pm.label"></option>
                  </template>
                </select>
                <p x-show="errors.paymentMethod" x-text="errors.paymentMethod" class="text-xs text-red-500 mt-1"></p>
              </div>
              <div>
                <label class="text-xs font-semibold text-gray-700 mb-1.5 block">
                  Status
                </label>
                <select x-model="formInputInvoice.status" @change="clearInvoiceError('status')" class="w-full border rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" :class="errors.status ? 'border-red-400' : 'border-gray-200'">
                  <option value="">Selecione...</option>
                  <option value="confirmed">Confirmado</option>
                  <option value="pending">Pendente</option>
                  <option value="cancelled">Cancelado</option>
                  <option value="refunded">Reembolsado</option>
                </select>
                <p x-show="errors.status" x-text="errors.status" class="text-xs text-red-500 mt-1"></p>
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1.5 block">
                Observações
              </label>
              <textarea x-model="formInputInvoice.notes" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" rows="2" placeholder="Opcional..."></textarea>
            </div>
            <div class="mb-4">
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold text-gray-700 block">
                  Itens / Serviços
                </label>
                <button type="button" @click="addItem()" class="text-xs text-amber-600 font-medium hover:text-amber-700 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                  Adicionar
                </button>
              </div>

              <div class="space-y-2">
                <template x-for="(item, index) in formInputInvoice.items" :key="index">
                  <div class="flex gap-2 items-start border p-2 rounded-lg bg-gray-50 border-gray-200">
                    <div class="flex-1">
                      <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-1 block">
                        Serviço
                      </label>
                      <select x-model="item.service" @change="onServiceChange(index)" class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                        <option value="">Selecione...</option>
                        <template x-for="svc in services" :key="svc.id">
                          <option :selected="svc.name === item.service" :value="svc.name" x-text="svc.name"></option>
                        </template>
                      </select>
                    </div>
                    <div class="w-20">
                      <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-1 block">
                        Valor
                      </label>
                      <input type="number" step="0.01" x-model="item.value" class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="0.00"/>
                    </div>
                    <div class="w-20">
                      <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-1 block">
                        Desc.
                      </label>
                      <input type="number" step="0.01" x-model="item.discount" class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="0.00"/>
                    </div>
                    <button type="button" @click="removeItem(index)" class="mt-5 text-gray-400 hover:text-red-500 p-1" title="Remover item">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                      </svg>
                    </button>
                  </div>
                </template>
              </div>

              <!-- Novo Resumo de Valores Abaixo dos Itens -->
              <div x-show="formInputInvoice.items.length > 0" class="mt-4 pt-3 border-t border-gray-200">
                <div class="flex justify-between items-center mb-1 text-sm text-gray-500">
                  <span>Subtotal:</span>
                  <span x-text="'R$ ' + subtotalValue"></span>
                </div>
                <div class="flex justify-between items-center mb-2 text-sm text-gray-500">
                  <span>Desconto Total:</span>
                  <span x-text="totalDiscount > 0 ? '- R$ ' + totalDiscount : 'R$ 0.00'" class="text-pink-600"></span>
                </div>
                <div class="flex justify-between items-center text-sm font-bold text-gray-900">
                  <span>Valor Total:</span>
                  <span x-text="'R$ ' + formInputInvoice.valueReceived" class="text-green-700 text-base"></span>
                </div>
                <p x-show="errors.valueReceived" x-text="errors.valueReceived" class="text-xs text-red-500 mt-1 text-right"></p>
              </div>
            </div>
            <input type="hidden" x-model="formInputInvoice.idScheduling"/>
            <div class="flex gap-3 pt-2">
              <button @click="openFormInvoice = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-200 transition-colors text-sm">
                Cancelar
              </button>
              <button @click="postInputInvoice()" class="flex-1 bg-pink-500 text-white font-bold py-3 rounded-xl hover:bg-pink-600 transition-colors text-sm" x-text="formInputInvoice.id ? 'Atualizar' : 'Salvar'"></button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end"></div>
    <script src="js/utils.js"></script>
    <script src="js/faturas.js"></script>
  </body>
</html>
