<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet" />
    <title>Histórico de Agendamentos — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css" />
    <script defer src="js/Alpine.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: "Roboto", sans-serif; }
        .nav-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .nav-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
    </style>
</head>
<body class="bg-gray-50" x-data="historicoApp">
    <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
        <a href="dashboard.html"
            class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5"
            aria-label="Voltar ao painel">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            <span class="text-sm font-medium hidden sm:inline">Painel</span>
        </a>
        <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="font-semibold text-gray-900 text-sm">Histórico de Agendamentos</span>
        </div>
        <div class="flex items-center gap-1.5 ml-auto">
            <div class="relative" x-data="{ avatarOpen: false }">
              <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
                <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
              </button>
              <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
                <div class="px-4 py-2.5 border-b border-gray-100">
                  <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
                  <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                    'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                    'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                    'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
                  }" x-text="getUserRoleLabel()"></span>
                </div>
                <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                  </svg>
                  Sair
                </button>
              </div>
            </div>
        </div>
    </header>

    <main class="min-h-screen pt-14">
        <div class="p-4 lg:p-6 max-w-3xl mx-auto space-y-4">
            <!-- Cabeçalho e Link para Ativos -->
            <div class="flex items-center justify-between">
                <div>
                    <div class="flex items-center gap-2">
                      <h2 class="text-xl font-bold text-gray-900">Histórico</h2>
                      <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800" x-text="filteredConcluded.length + ' concluído(s)'"></span>
                    </div>
                    <p class="text-sm text-gray-400 mt-0.5">Consulta de atendimentos realizados</p>
                </div>
                <a href="agendamentos.html"
                    class="text-sm font-medium text-pink-600 hover:text-pink-700 flex items-center gap-1 bg-pink-50 hover:bg-pink-100 px-3 py-2 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    Agendamentos ativos
                </a>
            </div>

            <!-- Barra de Busca e Filtros -->
            <div class="bg-white rounded-xl border border-gray-200 p-3 shadow-sm flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" x-model="searchQuery" @input="currentPage = 1" placeholder="Buscar por cliente ou WhatsApp..." class="w-full border border-gray-200 rounded-xl pl-9 pr-4 py-2 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600"/>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <div class="flex gap-2">
                    <select x-model="serviceFilter" @change="currentPage = 1" class="border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                        <option value="">Todos os Serviços</option>
                        <template x-for="s in servicesList" :key="s.id">
                            <option :value="s.name" x-text="s.name"></option>
                        </template>
                    </select>
                    <select x-model="professionalFilter" @change="currentPage = 1" class="border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600">
                        <option value="">Todos os Profissionais</option>
                        <template x-for="p in professionalsList" :key="p.id">
                            <option :value="p.name" x-text="p.name"></option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Loading State -->
            <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mx-auto"></div>
                <p class="text-sm font-medium text-gray-500 mt-4">Carregando histórico...</p>
            </div>

            <!-- Empty State -->
            <div x-show="!loading && filteredConcluded.length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
                <p class="text-3xl mb-2">📋</p>
                <p class="text-sm font-medium text-gray-500">Nenhum agendamento concluído encontrado</p>
            </div>

            <!-- Lista de Cards -->
            <div class="space-y-3" x-show="!loading && filteredConcluded.length > 0">
                <template x-for="(item, index) in paginatedConcluded" :key="item.id || index">
                    <div class="nav-card bg-white border border-gray-200 p-4 rounded-xl shadow-sm">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <span class="font-bold text-gray-900 text-sm" x-text="item.name"></span>
                                <span x-show="item.whatsapp" class="text-xs text-gray-400 ml-2" x-text="item.whatsapp"></span>
                            </div>
                            <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full shrink-0">Concluído</span>
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between text-xs text-gray-500 gap-1.5">
                            <div class="flex items-center gap-3">
                                <span class="flex items-center gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                    <span x-text="formatDate(item.date)"></span>
                                </span>
                                <span class="flex items-center gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    <span x-text="item.time"></span>
                                </span>
                                <span class="flex items-center gap-1 font-medium text-gray-700">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    <span x-text="item.service"></span>
                                </span>
                            </div>
                            <span class="text-xs text-gray-400" x-text="'Profissional: ' + item.professional"></span>
                        </div>

                        <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-100">
                            <button @click="openWhatsapp(item)" x-show="item.whatsapp" class="flex-1 bg-emerald-50 text-emerald-700 text-xs font-semibold py-2 rounded-lg hover:bg-emerald-100 transition-colors flex items-center justify-center gap-1">
                                WhatsApp
                            </button>
                            <a :href="'ordens-servico.html?appointmentId=' + item.id + '&clientId=' + (item.client_id || '') + '&professionalId=' + (item.professional_id || '') + '&serviceId=' + (item.service_id || '') + (item.service_order_id ? '&orderId=' + item.service_order_id : '')" class="flex-1 bg-amber-50 text-amber-700 text-xs font-semibold py-2 rounded-lg hover:bg-amber-100 transition-colors text-center block" style="background-color: #fff7ed; color: #c2410c;">
                                Ver O.S.
                            </a>
                            <a :href="'faturas.html?schedulingId=' + item.id + '&name=' + encodeURIComponent(item.name) + '&whatsapp=' + encodeURIComponent(item.whatsapp || '') + '&date=' + encodeURIComponent(item.date || '') + '&service=' + encodeURIComponent(item.service || '')" class="flex-1 bg-blue-50 text-blue-700 text-xs font-semibold py-2 rounded-lg hover:bg-blue-100 transition-colors text-center block">
                                Fatura
                            </a>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Sentinela de Rolagem Infinita -->
            <div x-show="hasMoreConcluded" 
                 x-init="createInfiniteScrollObserver($el, () => loadMoreConcluded())" 
                 class="py-5 text-center flex items-center justify-center gap-2 text-xs text-gray-400">
                <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-pink-500"></div>
                <span>Carregando mais agendamentos...</span>
            </div>

            <!-- Rodapé de Contagem -->
            <div x-show="!loading && filteredConcluded.length > 0" class="text-center py-3 text-xs text-gray-400">
                <span x-text="'Exibindo ' + Math.min(displayedCount, filteredConcluded.length) + ' de ' + filteredConcluded.length + ' agendamentos concluídos'"></span>
            </div>
        </div>
    </main>
    <script src="js/utils.js"></script>
    <script src="js/historico-agendamentos.js"></script>
</body>
</html>
