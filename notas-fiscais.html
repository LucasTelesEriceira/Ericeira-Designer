<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png"/>
    <link rel="manifest" href="assets/site.webmanifest"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet"/>
    <title>Notas Fiscais — Ericeira Designer</title>
    <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css"/>
    <script defer src="js/Alpine.js"></script>
    <style>[x-cloak] { display: none !important; } body { font-family: 'Roboto', sans-serif; }</style>
  </head>
  <body class="bg-gray-50" x-data="notasFiscaisApp">
    <header class="fixed inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3">
      <a href="dashboard.html" class="p-2 -ml-1 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center gap-1.5" aria-label="Voltar ao painel">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium hidden sm:inline">Painel</span>
      </a>
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <span class="font-semibold text-gray-900 text-sm">Notas Fiscais (NFS-e / NF-e)</span>
      </div>
      <div class="flex items-center gap-1.5 ml-auto">
        <div class="relative" x-data="{ avatarOpen: false }">
          <button @click="avatarOpen = !avatarOpen" class="h-8 w-8 rounded-full bg-pink-100 text-pink-700 font-bold text-sm flex items-center justify-center hover:bg-pink-200 transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300">
            <span x-text="getUserDisplayName().charAt(0).toUpperCase()"></span>
          </button>
          <div x-show="avatarOpen" x-cloak @click.outside="avatarOpen = false" x-transition class="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-200 py-1 w-52 z-50">
            <div class="px-4 py-2.5 border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-900 truncate" x-text="getUserDisplayName()"></p>
              <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mt-1" :class="{
                'bg-purple-100 text-purple-700': getUserRole() === 'admin',
                'bg-blue-100 text-blue-700': getUserRole() === 'receptionist',
                'bg-emerald-100 text-emerald-700': getUserRole() === 'professional'
              }" x-text="getUserRoleLabel()"></span>
            </div>
            <button @click="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Sair
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="min-h-screen pt-14">
      <div class="p-4 lg:p-6 max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Módulo Fiscal & Notas Fiscais</h2>
            <p class="text-sm text-gray-400 mt-0.5">Registro de notas de serviço (NFS-e) e vendas emitidas</p>
          </div>
          <button @click="openNewInvoiceForm()" class="bg-purple-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-purple-700 transition-colors">
            + Emitir / Registrar Nota
          </button>
        </div>

        <div x-show="loading" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mx-auto"></div>
          <p class="text-sm font-medium text-gray-500 mt-4">Carregando notas fiscais...</p>
        </div>

        <div x-show="!loading && invoices.length === 0" class="bg-white border border-dashed border-gray-200 rounded-xl p-10 text-center">
          <p class="text-3xl mb-2">📑</p>
          <p class="text-sm font-medium text-gray-500">Nenhuma Nota Fiscal registrada</p>
        </div>

        <div class="space-y-3" x-show="!loading">
          <template x-for="n in invoices" :key="n.id">
            <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-bold text-gray-900 text-sm" x-text="n.invoice_number"></span>
                  <span class="text-xs font-bold px-2 py-0.5 rounded-full" :class="{
                    'bg-emerald-50 text-emerald-700 border border-emerald-100': n.status === 'issued',
                    'bg-red-50 text-red-700 border border-red-100': n.status === 'cancelled',
                    'bg-amber-50 text-amber-700 border border-amber-100': n.status === 'draft'
                  }" x-text="n.status === 'issued' ? 'Emitida' : (n.status === 'cancelled' ? 'Cancelada' : 'Rascunho')"></span>
                </div>
                <p class="text-xs text-gray-400" x-text="'Emissão: ' + (n.issued_at || '') + (n.verification_code ? ' • Cód. Verificação: ' + n.verification_code : '')"></p>
                <p x-show="n.access_key" class="text-xs text-gray-500 font-mono mt-1 truncate max-w-md" x-text="'Chave: ' + n.access_key"></p>
              </div>
              <div class="text-right shrink-0">
                <p class="font-bold text-purple-700 text-sm" x-text="formatCurrency(n.total || 0)"></p>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Modal Nova Nota Fiscal -->
      <div x-show="openFormInvoice" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-end lg:items-center justify-center" x-transition>
        <div @click.outside="openFormInvoice = false" class="bg-white w-full lg:max-w-lg lg:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 class="font-bold text-gray-900">Registrar Nota Fiscal</h3>
            <button @click="openFormInvoice = false" class="text-gray-400 hover:text-gray-600">✕</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Número da Nota *</label>
              <input type="text" x-model="formInvoice.invoice_number" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="NF-001092"/>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Cód. Verificação</label>
              <input type="text" x-model="formInvoice.verification_code" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="ABC9876"/>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700 mb-1 block">Chave de Acesso (44 dígitos)</label>
            <input type="text" x-model="formInvoice.access_key" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-900 font-mono focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="35260812345678000199550010000010921001234567"/>
          </div>

          <!-- Itens da Nota -->
          <div class="border-t border-gray-100 pt-3">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-bold text-gray-900 uppercase">Itens da Nota Fiscal</label>
              <button @click="addItemToInvoice()" class="text-xs bg-purple-50 text-purple-700 font-bold px-2.5 py-1 rounded-lg hover:bg-purple-100 transition-colors">+ Item</button>
            </div>

            <div class="space-y-2">
              <template x-for="(item, idx) in formInvoice.items" :key="idx">
                <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl">
                  <input type="text" x-model="item.description" class="flex-1 border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-900 bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Descrição do Serviço ou Produto"/>
                  <input type="number" min="1" x-model="item.quantity" class="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs text-center bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="Qtd"/>
                  <input type="number" step="0.01" x-model="item.unit_price" class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-xs text-right bg-white focus:appearance-none focus:border-none focus:outline-none focus:outline-offset-0 focus:outline-pink-600" placeholder="R$"/>
                  <button @click="removeItemFromInvoice(idx)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg text-xs">✕</button>
                </div>
              </template>
            </div>
          </div>

          <div class="bg-purple-50 rounded-xl p-3 flex items-center justify-between">
            <span class="text-xs font-bold text-purple-800">Total da Nota:</span>
            <span class="text-base font-bold text-purple-700" x-text="formatCurrency(calculateTotalInvoice())"></span>
          </div>

          <div class="flex gap-3 pt-2">
            <button @click="openFormInvoice = false" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-200 text-sm">Cancelar</button>
            <button @click="postInvoice()" class="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 text-sm">Salvar Nota</button>
          </div>
        </div>
      </div>
    </main>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end"></div>
    <script src="js/utils.js"></script>
    <script src="js/notas-fiscais.js"></script>
  </body>
</html>
